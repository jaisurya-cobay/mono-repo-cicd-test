name: Deploy

# push qa       → QA:          full tests for changed apps, build each image / web bundle ONCE, deploy
# push staging  → staging:     reuse what QA ran (no tests, no builds), rc version tag, Release PR
# push master   → production:  reuse what staging ran, release tag + GitHub Release, back-merge if needed
#
# Per app: deploys when its code changed since its last SUCCESSFUL deploy to that environment.
# Live or dry run per app + environment comes from the LIVE_DEPLOYS variable (see tools/ci/lib.mjs).
# CICD_ENABLED=false turns the whole workflow off.
on:
  push:
    branches: [qa, staging, master]

permissions: {}

# A newer push replaces a still-waiting run (it contains the same changes); a running one is never
# cancelled. Each deploy job also holds a per-app lock shared with rollback.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    if: vars.CICD_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      server: ${{ steps.plan.outputs.server }}
      static: ${{ steps.plan.outputs.static }}
      projects: ${{ steps.plan.outputs.projects }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - id: stage
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in qa) s=qa ;; staging) s=staging ;; master) s=production ;; esac
          echo "stage=$s" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ steps.stage.outputs.stage }}
          HEAD_SHA: ${{ github.sha }}
          LIVE_DEPLOYS: ${{ vars.LIVE_DEPLOYS }}
        run: node tools/ci/plan.mjs

  # QA only. staging and production promote code that already passed here (the gate proves it).
  test:
    name: full tests
    needs: plan
    if: needs.plan.outputs.any == 'true' && needs.plan.outputs.stage == 'qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - env:
          PROJECTS: ${{ needs.plan.outputs.projects }}
        run: pnpm exec nx run-many -t lint typecheck test integration -p "$PROJECTS" --outputStyle=static

  image:
    name: image
    needs: [plan, test]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.server != '[]' && contains(fromJSON('["success","skipped"]'), needs.test.result)
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.server) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      app: ${{ matrix.app }}
      root: ${{ matrix.root }}
      hash: ${{ matrix.hash }}
      sha: ${{ github.sha }}

  # Web bundles: built ONCE per content hash, stored, reused by every environment.
  web-build:
    name: web build (${{ matrix.app }})
    needs: [plan, test]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.static != '[]' && contains(fromJSON('["success","skipped"]'), needs.test.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.static) }}
    env:
      APP: ${{ matrix.app }}
      HASH: ${{ matrix.hash }}
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: stored
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "id=$(tools/ci/web-build.sh find "$APP" "$HASH")" >> "$GITHUB_OUTPUT"
      - if: steps.stored.outputs.id == ''
        uses: ./.github/actions/setup
      - if: steps.stored.outputs.id == ''
        run: pnpm exec nx run "$PROJECT:build" --outputStyle=static
      - if: steps.stored.outputs.id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-${{ matrix.app }}-${{ matrix.hash }}
          path: ${{ matrix.root }}/dist
          retention-days: 90
      - if: steps.stored.outputs.id != ''
        run: echo "::notice::web-$APP-$HASH already built, reusing it"

  deploy-server:
    name: server
    needs: [plan, image]
    if: always() && needs.image.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.server) }}
    permissions:
      contents: read
      deployments: write
      packages: write
      id-token: write
    uses: ./.github/workflows/_deploy-server.yml
    with:
      app: ${{ matrix.app }}
      stage: ${{ needs.plan.outputs.stage }}
      sha: ${{ github.sha }}
      hash: ${{ matrix.hash }}
      live: ${{ matrix.live }}
      record: ${{ matrix.record }}

  # After the server, so a client never goes live against an API that isn't there yet.
  deploy-web:
    name: web
    needs: [plan, image, web-build, deploy-server]
    if: >-
      always() && needs.web-build.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.image.result) &&
      contains(fromJSON('["success","skipped"]'), needs.deploy-server.result)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.static) }}
    permissions:
      contents: read
      deployments: write
      actions: read
      id-token: write
    uses: ./.github/workflows/_deploy-web.yml
    with:
      app: ${{ matrix.app }}
      root: ${{ matrix.root }}
      stage: ${{ needs.plan.outputs.stage }}
      sha: ${{ github.sha }}
      hash: ${{ matrix.hash }}
      live: ${{ matrix.live }}
      record: ${{ matrix.record }}

  # staging: rc tag + open/update the Release PR. master: release tag + GitHub Release + back-merge.
  # Runs only when nothing failed. Every step is safe to re-run.
  version:
    name: version
    needs: [plan, deploy-server, deploy-web]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.stage != 'qa' &&
      contains(fromJSON('["success","skipped"]'), needs.deploy-server.result) &&
      contains(fromJSON('["success","skipped"]'), needs.deploy-web.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: bot
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Credentials kept on purpose: this job pushes tags and back-merge branches as the release bot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] (v7)
        with:
          fetch-depth: 0
          filter: tree:0
          token: ${{ steps.bot.outputs.token }}
      - id: v
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          MODE: ${{ needs.plan.outputs.stage == 'staging' && 'rc' || 'final' }}
          RELEASE_VERSION_FLOOR: ${{ vars.RELEASE_VERSION_FLOOR }}
        run: node tools/ci/version.mjs
      - name: Tag
        if: steps.v.outputs.tag != ''
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "$TAG already exists"; exit 0; fi
          # An rc for this exact commit already exists: don't stack rc.N tags on re-runs.
          if [[ $TAG == *-rc.* ]] && git tag --points-at HEAD | grep -q "^${TAG%-rc.*}-rc\."; then echo "rc already tagged on this commit"; exit 0; fi
          git tag "$TAG" "$GITHUB_SHA" && git push origin "refs/tags/$TAG"
      - name: Release PR (staging)
        if: needs.plan.outputs.stage == 'staging' && steps.v.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ steps.v.outputs.version }}
          PRS: ${{ steps.v.outputs.prs }}
        run: |
          body=$(printf 'Release %s. Press **Release** in Actions after approval; the Merge button is blocked.\n\n%s' "$VERSION" \
            "$(jq -r '.[] | "- #\(.number) \(.title)"' <<<"$PRS")")
          n=$(gh pr list --base master --head staging --state open --json number --jq '.[0].number // empty')
          if [[ -n $n ]]; then gh pr edit "$n" --title "release: $VERSION" --body "$body"
          else gh pr create --base master --head staging --title "release: $VERSION" --body "$body"; fi
      - name: GitHub Release (production)
        if: needs.plan.outputs.stage == 'production' && steps.v.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 && { echo "$VERSION already released"; exit 0; }
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
      # Commits on master that the branch lacks (no merges) = hotfixes not yet back. Bot PRs trigger
      # ci normally; auto-merge lands them when ci is green. Conflicts stay open for a person.
      - name: Back-merge (production)
        if: needs.plan.outputs.stage == 'production'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          for target in staging qa; do
            if [[ -z $(git log --no-merges --format=%H "origin/$target..$GITHUB_SHA") ]]; then echo "$target: has every hotfix"; continue; fi
            branch="backmerge/master-to-$target-${GITHUB_SHA:0:7}"
            git push origin "$GITHUB_SHA:refs/heads/$branch" 2>/dev/null || true
            n=$(gh pr list --head "$branch" --base "$target" --state open --json number --jq '.[0].number // empty')
            [[ -n $n ]] || n=$(gh pr create --base "$target" --head "$branch" --title "chore: back-merge master into $target" \
              --body "Automatic back-merge after the production release at ${GITHUB_SHA:0:7}. Auto-merges when ci is green." | grep -o '[0-9]*$')
            if [[ $(gh pr view "$n" --json mergeable --jq .mergeable) == CONFLICTING ]]; then
              gh pr edit "$n" --add-label backmerge-conflict
              echo "::warning::Back-merge into $target conflicts (PR #$n). A person resolves it; the bot never does."
            else
              gh pr merge "$n" --auto --merge
            fi
          done

  # A promotion PR re-checks the moment its source branch moves, which is before that branch's deploy
  # finishes, so its gate can fail on the old deploy. Once the deploy is done, re-run that gate.
  refresh-gate:
    name: refresh promotion gate
    needs: [plan, deploy-server, deploy-web]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.stage != 'production' &&
      contains(fromJSON('["success","skipped"]'), needs.deploy-server.result) &&
      contains(fromJSON('["success","skipped"]'), needs.deploy-web.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.ref_name }}
          TARGET: ${{ github.ref_name == 'qa' && 'staging' || 'master' }}
        run: |
          sha=$(gh pr list --base "$TARGET" --head "$SOURCE" --state open --json headRefOid --jq '.[0].headRefOid // empty')
          [[ -n $sha ]] || { echo "No open $SOURCE → $TARGET PR"; exit 0; }
          [[ $sha == "$GITHUB_SHA" ]] || { echo "PR head $sha is newer than this deploy; its own deploy will refresh it"; exit 0; }
          run=$(gh run list --workflow ci.yml --commit "$sha" --event pull_request --limit 1 --json databaseId,conclusion --jq '.[0] | select(.conclusion == "failure") | .databaseId')
          if [[ -n $run ]]; then gh run rerun "$run" --failed && echo "Re-ran the gate on the $SOURCE → $TARGET PR"; else echo "Gate not failing; nothing to do"; fi

  # Jira + Slack never block a deploy. Lab: prints what the suite would send.
  notify:
    name: notify
    needs: [plan, deploy-server, deploy-web, version]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.plan.outputs.stage }}
          BEFORE: ${{ github.event.before }}
          RESULT: ${{ (needs.deploy-server.result == 'failure' || needs.deploy-web.result == 'failure') && 'failure' || 'success' }}
        run: node tools/ci/notify.mjs
